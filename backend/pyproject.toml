[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "tpl-demo-backend"
version = "0.1.0"
description = "Modular FastAPI backend for tpl demo"
readme = "../AGENTS.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pyserial>=3.5",
  "websockets>=16.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "ruff>=0.11.0",
]
