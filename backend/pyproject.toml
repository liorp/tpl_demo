[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "tpl-demo-backend"
version = "0.1.0"
description = "Modular FastAPI backend for tpl demo"
readme = "../AGENTS.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pyserial>=3.5",
  "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = [".."]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
